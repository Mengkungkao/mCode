<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="mCode">
<meta name="format-detection" content="telephone=no">
<title>mCode Studio</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/static/vendor/codemirror/codemirror.css">
<link rel="stylesheet" href="/static/vendor/codemirror/addon/fold/foldgutter.css">
<link rel="stylesheet" href="/static/vendor/codemirror/addon/dialog/dialog.css">
<link rel="stylesheet" href="/static/vendor/codemirror/addon/hint/show-hint.css">
<link rel="stylesheet" href="/static/vendor/codemirror/addon/search/matchesonscrollbar.css">
<link rel="stylesheet" href="/static/vendor/codemirror/addon/lint/lint.css">
<link rel="stylesheet" href="/static/vendor/xterm/xterm.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="layout-desktop" data-mview="home">
<header class="m-header" id="m-header">
  <button class="m-back hidden" id="m-back" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span id="m-back-label">Back</span></button>
  <div class="m-title-wrap"><div class="m-title" id="m-title">mCode</div><div class="m-subtitle" id="m-subtitle"></div></div>
  <div class="m-actions" id="m-actions"></div>
</header>
<div class="m-job hidden" id="m-job" role="status"></div>
<header class="topbar">
  <div class="brand"><span class="logo">m</span><span>mCode Studio</span></div>
  <button class="pick" id="project-pick" title="Projects"><span class="pick-label">No project</span><span class="caret">▾</span></button>
  <button class="pick" id="device-pick" title="Board and port"><span class="dot" id="device-dot"></span><span class="pick-label">No board</span><span class="caret">▾</span></button>
  <div class="actions">
    <button class="btn" id="btn-build" title="Compile (Ctrl+B)">Build</button>
    <button class="btn" id="btn-test" title="Run tests that need no hardware">Test</button>
    <button class="btn primary" id="btn-upload" title="Flash the board (asks first)">Flash</button>
    <button class="btn icon" id="btn-more" title="More build actions">⋯</button>
  </div>
  <div class="spacer"></div>
  <button class="pill" id="claude-pill" title="Claude Code"><span class="dot"></span><span class="pill-label">Claude</span></button>
  <button class="btn icon" id="btn-settings" title="Settings">⚙</button>
</header>
<div class="main" id="main">
  <nav class="activity" id="activity">
    <button data-view="dashboard" title="Dashboard" class="active">⌂</button>
    <button data-view="explorer" title="Project explorer">☰</button>
    <button data-view="hardware" title="Hardware manager">⌁</button>
    <button data-view="libraries" title="Libraries">▤</button>
    <button data-view="git" title="Version history">⑂</button>
    <div class="grow"></div>
    <button data-toggle="ai" title="Show or hide the AI Engineer">✦</button>
    <button data-toggle="bottom" title="Show or hide the bottom panel">▁</button>
  </nav>
  <aside class="side" id="side"><div class="side-head"><span id="side-title">Explorer</span><span class="side-tools" id="side-tools"></span></div><div class="side-body" id="side-body"></div></aside>
  <div class="gutter v" data-resize="side"></div>
  <section class="center" id="center">
    <div class="tabs" id="tabs"></div>
    <div class="center-body">
      <div class="dashboard" id="dashboard"></div>
      <div class="editor-host hidden" id="editor-host"></div>
    </div>
    <div class="m-keys" id="m-keys" aria-label="Code keys"></div>
  </section>
  <div class="gutter v" data-resize="ai" id="ai-gutter"></div>
  <aside class="ai" id="ai">
    <div class="ai-head">
      <span class="ai-title">✦ AI Engineer</span>
      <span class="spacer"></span>
      <button class="btn icon small" id="ai-new" title="New conversation">＋</button>
    </div>
    <div class="ai-body" id="ai-body" aria-live="polite"></div>
    <div class="ai-review hidden" id="ai-review"></div>
    <div class="ai-quick" id="ai-quick">
      <button data-kind="create">Create firmware</button>
      <button data-kind="explain">Explain code</button>
      <button data-kind="fix-build">Fix build errors</button>
      <button data-kind="performance">Improve performance</button>
      <button data-kind="security">Review security</button>
      <button data-kind="wiring">Wiring doc</button>
      <button data-kind="analyze-serial">Explain serial output</button>
    </div>
    <div class="ai-input">
      <div class="composer">
        <div class="attachments hidden" id="ai-attachments"></div>
        <textarea id="ai-text" rows="2" enterkeyhint="enter" autocapitalize="sentences" aria-label="Message Claude" placeholder="Ask Claude to create, explain, fix or improve firmware…"></textarea>
        <div class="composer-bar">
          <button class="cbtn icon" id="ai-attach" type="button" title="Attach the open file or serial output" aria-label="Attach"><svg class="ci" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <button class="cbtn mode" id="ai-mode-btn" type="button" aria-label="Mode"></button>
          <button class="cbtn model" id="ai-model-btn" type="button" aria-label="Model"></button>
          <span class="spacer"></span>
          <button class="cbtn ctx" id="ai-context" type="button" aria-label="Usage"></button>
          <button class="send" id="ai-send" type="button" title="Send (Enter)" aria-label="Send"><svg class="ci" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6 11.5l6-6 6 6"/></svg></button>
          <button class="send stop hidden" id="ai-stop" type="button" title="Stop Claude" aria-label="Stop"><svg class="ci" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></svg></button>
        </div>
      </div>
    </div>
  </aside>
</div>
<div class="gutter h" data-resize="bottom" id="bottom-gutter"></div>
<section class="bottom" id="bottom">
  <div class="bottom-tabs" id="bottom-tabs">
    <button data-panel="output" class="active">Build output</button>
    <button data-panel="problems">Problems <span class="count" id="problem-count"></span></button>
    <button data-panel="terminal">Terminal</button>
    <button data-panel="serial">Serial monitor</button>
    <button data-panel="tests">Tests</button>
    <div class="spacer"></div>
    <span class="job-status" id="job-status"></span>
    <button class="btn icon small hidden" id="job-cancel" title="Stop the running task">■</button>
  </div>
  <div class="panel" data-panel="output"><pre class="output" id="output"></pre></div>
  <div class="panel hidden" data-panel="problems"><div id="problems"></div></div>
  <div class="panel hidden" data-panel="terminal"><div class="term-bar" id="term-bar"></div><div class="term-host" id="term-host"></div></div>
  <div class="panel hidden" data-panel="serial">
    <div class="serial-bar">
      <select id="serial-port"></select>
      <select id="serial-baud"></select>
      <button class="btn small" id="serial-connect">Connect</button>
      <label><input type="checkbox" id="serial-hex"> Hex</label>
      <label><input type="checkbox" id="serial-ts" checked> Time</label>
      <label><input type="checkbox" id="serial-auto" checked> Auto-scroll</label>
      <button class="btn small" id="serial-pause">Pause</button>
      <button class="btn small" id="serial-clear">Clear</button>
      <button class="btn small" id="serial-save">Save</button>
      <button class="btn small" id="serial-reset" title="Pulse the board's reset line">Reset board</button>
      <button class="btn small" id="serial-ai" title="Ask Claude to analyse the output">Ask AI</button>
      <input id="serial-search" placeholder="Search output">
    </div>
    <pre class="output serial-out" id="serial-out"></pre>
    <div class="serial-send">
      <input id="serial-input" placeholder="Send to the board…">
      <select id="serial-ending"><option value="lf">LF</option><option value="crlf">CR+LF</option><option value="cr">CR</option><option value="none">None</option></select>
      <label><input type="checkbox" id="serial-send-hex"> Hex</label>
      <button class="btn small" id="serial-send">Send</button>
    </div>
  </div>
  <div class="panel hidden" data-panel="tests"><div id="tests"></div></div>
</section>
<main class="m-pages" id="m-pages">
  <section class="m-page" id="m-home" data-page="home"></section>
  <section class="m-page" id="m-projects" data-page="projects"></section>
  <section class="m-page" id="m-devices" data-page="devices"></section>
  <section class="m-page" id="m-settings" data-page="settings"></section>
</main>
<nav class="tabbar" id="tabbar" aria-label="Sections">
  <button data-tab="home" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 4l8.5 6.5V20a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button data-tab="projects" aria-label="Projects"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2h8.4A1.5 1.5 0 0 1 21 8.5v10a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg><span>Projects</span></button>
  <button data-tab="ai" aria-label="AI Engineer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4zM18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg><span>AI Engineer</span></button>
  <button data-tab="devices" aria-label="Devices"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7zM10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></svg><span>Devices</span></button>
  <button data-tab="settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM19.4 13.5l1.6 1.2-2 3.4-1.9-.7a7 7 0 0 1-2 1.2L14.8 21h-4l-.3-2.4a7 7 0 0 1-2-1.2l-1.9.7-2-3.4 1.6-1.2a7 7 0 0 1 0-2.4L4.6 9.9l2-3.4 1.9.7a7 7 0 0 1 2-1.2L10.8 3h4l.3 2.4a7 7 0 0 1 2 1.2l1.9-.7 2 3.4-1.6 1.2a7 7 0 0 1 0 2.4z"/></svg><span>Settings</span></button>
</nav>
<footer class="statusbar">
  <span id="sb-left"></span><span class="spacer"></span><span id="sb-cursor"></span><span id="sb-lang"></span><span id="sb-conn" class="conn">●</span>
</footer>
<div class="modal-back hidden" id="modal-back"><div class="modal" id="modal"></div></div>
<div class="menu hidden" id="menu"></div>
<div class="toasts" id="toasts"></div>

<script src="/static/vendor/codemirror/addon/dialog/dialog.js"></script>
<script src="/static/vendor/codemirror/addon/search/searchcursor.js"></script>
<script src="/static/vendor/codemirror/addon/search/search.js"></script>
<script src="/static/vendor/codemirror/addon/search/jump-to-line.js"></script>
<script src="/static/vendor/codemirror/addon/scroll/annotatescrollbar.js"></script>
<script src="/static/vendor/codemirror/addon/search/matchesonscrollbar.js"></script>
<script src="/static/vendor/codemirror/addon/fold/foldcode.js"></script>

<script src="/static/vendor/codemirror/addon/hint/show-hint.js"></script>

<script src="/static/vendor/codemirror/addon/edit/closebrackets.js"></script>

<script src="/static/vendor/codemirror/addon/comment/comment.js"></script>

<script src="/static/chat.js"></script>
<script src="/static/app.js"></script>
<script src="/static/mobile.js"></script>
</body>
</html>
